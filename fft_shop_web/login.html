<!doctype html><html lang="bn"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#ffc107"><title>লগইন - FFT SHOP</title><link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin><link href="https://fonts.googleapis.com/css2?family=Hind+Siliguri:wght@400;500;600;700&display=swap" rel="stylesheet"><link rel="stylesheet" href="auth.css"></head><body><main class="auth-page"><div class="lang"><span>◎</span><span class="flag">🇧🇩</span></div><section class="auth-brand"><div class="logo-wrap"><img src="assets/logo.png" alt="FFT SHOP"></div><h1 class="auth-title">আপনার অ্যাকাউন্টে লগইন করুন</h1></section><form class="auth-form" id="loginForm"><div class="field-box"><div class="field-icon">▯</div><input id="phone" type="tel" inputmode="tel" autocomplete="tel" placeholder="মোবাইল নম্বর" required></div><div class="field-box"><div class="field-icon">♙</div><input id="password" type="password" autocomplete="current-password" placeholder="পাসওয়ার্ড" required><span class="eye" onclick="togglePassword('password',this)">●</span></div><div class="auth-error" id="error"></div><button class="submit" type="submit">লগইন</button><div class="switch-text">অ্যাকাউন্ট নেই? <a href="register.html">নিবন্ধন করুন</a></div></form></main><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><script src="auth.js"></script></body></html>
